{% extends 'dashboard_base.html' %}

{% block dashboard_content %}
<header class="dashboard-header">
  <div>
    <h1 class="dashboard-title">USER PROFILE</h1>
    <p class="dashboard-subtitle">Update your account credentials and personal information.</p>
  </div>
</header>

<div style="display: flex; flex-direction: column; gap: 24px;">

  <!-- Personal Details Form -->
  <div class="location-form-card">
    <h3 class="panel-title" style="margin-bottom: 20px;">Personal Details</h3>
    
    <form method="POST" action="{% url 'profile' %}" class="location-form">
      {% csrf_token %}
      <input type="hidden" name="action_type" value="update_profile">

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" value="{{ user.username }}" required>
      </div>

      <div class="form-group">
        <label for="first_name" class="form-label">First Name</label>
        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}">
      </div>

      <div class="form-group">
        <label for="last_name" class="form-label">Last Name</label>
        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Save Details</button>
      </div>
    </form>
  </div>

  <!-- Password Reset Form -->
  <div class="location-form-card">
    <h3 class="panel-title" style="margin-bottom: 6px;">Security & Password</h3>
    <p class="dash-card-desc" style="margin-bottom: 20px;">Change your password to keep your dashboard secure.</p>

    <form method="POST" action="{% url 'profile' %}" class="location-form">
      {% csrf_token %}
      <input type="hidden" name="action_type" value="change_password">

      <div class="form-group">
        <label for="old_password" class="form-label">Current Password</label>
        <input type="password" id="old_password" name="old_password" required>
      </div>

      <div class="form-group">
        <label for="new_password1" class="form-label">New Password</label>
        <input type="password" id="new_password1" name="new_password1" required>
      </div>

      <div class="form-group">
        <label for="new_password2" class="form-label">Confirm New Password</label>
        <input type="password" id="new_password2" name="new_password2" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Update Password</button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
