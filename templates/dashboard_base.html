{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Project Lighthouse</title>
  
  <!-- Base Dashboard Layout Styles -->
  <link rel="stylesheet" href="{% static 'css/dashboard/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- View-Specific Styles -->
  {% block dashboard_css %}{% endblock %}
</head>
<body class="dashboard-body">
  <div class="dashboard-wrapper" id="dashWrapper">

    <script>
      if (localStorage.getItem('sidebarState') === 'collapsed') {
        document.getElementById('dashWrapper').classList.add('sidebar-collapsed');
      }
    </script>
    

    <!-- Collapsible Sidebar -->
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <h2 class="editorial-title">dashboard</h2>
        </div>
        <!-- Integrated Toggle Button -->
        <button class="sidebar-toggle-btn" id="toggleSidebar" aria-label="Toggle Navigation Sidebar" type="button">
          <!-- Left-pointing collapse icon (Visible when OPEN) -->
          <svg class="toggle-icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <polyline points="16 16 12 12 16 8"></polyline>
          </svg>
          <!-- Right-pointing expand icon (Visible when CLOSED) -->
          <svg class="toggle-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <polyline points="13 8 17 12 13 16"></polyline>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <!-- Active class is assigned dynamically based on the current URL name -->
        <a href="{% url 'show_home' %}" class="sidebar-link {% if request.resolver_match.url_name == 'show_home' %}active{% endif %}">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="link-text">Home</span>
        </a>
        
        <a href="{% url 'profile' %}" class="sidebar-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span class="link-text">Profile</span>
        </a>
        
        <a href="{% url 'settings' %}" class="sidebar-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span class="link-text">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}
          <!-- Added title so tooltip shows on hover when collapsed -->
          <button type="submit" class="btn-ghost" title="Logout">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span class="link-text">Logout</span>
          </button>
        </form>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="dashboard-main">
      <div class="dashboard-content-container">
        {% block dashboard_content %}{% endblock %}
      </div>
    </main>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wrapper = document.getElementById('dashWrapper');
      const toggleBtn = document.getElementById('toggleSidebar');

      if (toggleBtn && wrapper) {
        toggleBtn.addEventListener('click', () => {
          // Toggle the class
          wrapper.classList.toggle('sidebar-collapsed');
          
          // Save the new state to local storage
          if (wrapper.classList.contains('sidebar-collapsed')) {
            localStorage.setItem('sidebarState', 'collapsed');
          } else {
            localStorage.setItem('sidebarState', 'expanded');
          }
        });
      }
    });
  </script>
</body>
</html>
