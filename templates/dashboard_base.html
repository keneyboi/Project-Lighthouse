<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Project Lighthouse</title>
  
  {% load static %}
  <!-- Base Dashboard Layout Styles -->
  <link rel="stylesheet" href="{% static 'css/dashboard/dashboard.css' %}">
  
  <!-- View-Specific Styles -->
  {% block dashboard_css %}{% endblock %}
</head>
<body class="dashboard-body">
  <div class="dashboard-wrapper">
    
    <!-- Floating Persistent Toggle Button -->
    <button class="sidebar-toggle-btn" id="toggleSidebar" aria-label="Toggle Navigation Sidebar" type="button">
      <svg class="toggle-icon-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg class="toggle-icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Collapsible Sidebar -->
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <h2 class="editorial-title">dashboard</h2>
          <span class="user-badge font-mono">@{{ user.username }}</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="{% url 'show_home' %}" class="sidebar-link active">Home</a>
        <a href="{% url 'profile' %}" class="sidebar-link">Profile</a>
        <a href="{% url 'settings' %}" class="sidebar-link">Settings</a>
      </nav>

      <div class="sidebar-footer">
        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn-ghost">Logout</button>
        </form>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="dashboard-main">
      <div class="dashboard-content-container">
        {% block dashboard_content %}{% endblock %}
      </div>
    </main>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wrapper = document.querySelector('.dashboard-wrapper');
      const toggleBtn = document.getElementById('toggleSidebar');

      if (toggleBtn && wrapper) {
        toggleBtn.addEventListener('click', () => {
          wrapper.classList.toggle('sidebar-collapsed');
        });
      }
    });
  </script>
</body>
</html>
