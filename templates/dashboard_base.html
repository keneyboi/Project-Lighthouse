{% extends 'base.html' %}

{% block content %}
<div class="dashboard-wrapper">

  <!-- Left Sidebar / Quick Actions Bar -->
  <aside class="dashboard-sidebar">
  <div class="sidebar-brand">
    <h2>DASHBOARD</h2>
    <span class="user-badge">@{{ user.username }}</span>
  </div>

  <nav class="sidebar-nav">
    <a href="{% url 'show_home' %}" class="sidebar-link">Home</a>
    <a href="{% url 'profile' %}" class="sidebar-link">Profile</a>
    <a href="{% url 'settings' %}" class="sidebar-link">Settings</a>
  </nav>

  <div class="sidebar-footer">
    <form method="POST" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout-btn-sidebar" >Logout</button>
    </form>
  </div>
</aside>
  </aside>

  <!-- Right Main View Area -->
  <main class="dashboard-main-content">
    {% block dashboard_content %}{% endblock %}
  </main>

</div>
{% endblock %}
